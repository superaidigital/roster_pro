name: Production Security

on:
  pull_request:
  push:
    branches:
      - security-hardening-v1

permissions:
  contents: read

jobs:
  production-security:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: roster_security_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: production
      APP_BASE_URL: https://roster-security.example.local
      APP_RELEASE_ID: ci-security-release-1

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: roster_security_test
      DB_USER: roster_app
      DB_PASSWORD: testpass
      DB_TIMEZONE: '+07:00'

      BACKUP_DIR: storage/backups
      ROSTER_CRON_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      TRUST_PROXY_HEADERS: '1'
      TRUSTED_PROXY_IPS: 127.0.0.1
      CSP_MODE: report-only

      SESSION_IDLE_TIMEOUT_SECONDS: 28800
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: 43200
      SESSION_REGEN_INTERVAL_SECONDS: 900
      SECURITY_MIN_SCORE: 85

      MAINTENANCE_STATE_DIR: storage/runtime
      MAINTENANCE_RETRY_AFTER: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zlib, fileinfo
          coverage: none

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Load canonical schema
        run: mariadb -h 127.0.0.1 -P 3306 -uroot -proot roster_security_test < database/schema.sql

      - name: Create least-privilege runtime database account
        shell: bash
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -P 3306 -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'roster_app'@'%' IDENTIFIED BY 'testpass';
          GRANT SELECT, INSERT, UPDATE, DELETE ON roster_security_test.* TO 'roster_app'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Baseline canonical migration history
        env:
          DB_USER: root
          DB_PASSWORD: root
        run: php scripts/migrate.php --baseline --confirm=SCHEMA-LOADED

      - name: Production preflight
        run: php -d display_errors=0 -d expose_php=0 scripts/preflight.php --strict

      - name: Security compliance gate
        run: php -d display_errors=0 -d expose_php=0 scripts/security_check.php --strict --min-score=85

      - name: Secret scan
        run: php scripts/secret_scan.php

      - name: Generate CycloneDX SBOM
        run: php scripts/generate_sbom.php --output=build/sbom.cdx.json

      - name: Validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $d=json_decode(file_get_contents("build/sbom.cdx.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($d["bomFormat"] ?? "") !== "CycloneDX") exit(2);
            if (($d["specVersion"] ?? "") !== "1.6") exit(3);
            echo "SBOM_VALID\n";
          '

      - name: Start hardened PHP application server
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=0 -d expose_php=0 -S 127.0.0.1:8080 index.php > /tmp/roster-security-server.log 2>&1 &
          echo $! > /tmp/roster-security-server.pid
          for i in {1..30}; do
            if curl -fsS -H 'X-Forwarded-Proto: https'               'http://127.0.0.1:8080/?c=health&a=live' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roster-security-server.log
          exit 1

      - name: Verify production security headers and cookie flags
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/security-headers.txt -o /tmp/login.html             -H 'X-Forwarded-Proto: https'             'http://127.0.0.1:8080/?c=auth&a=index'

          cat /tmp/security-headers.txt

          grep -qi '^X-Content-Type-Options: nosniff' /tmp/security-headers.txt
          grep -qi '^X-Frame-Options: SAMEORIGIN' /tmp/security-headers.txt
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' /tmp/security-headers.txt
          grep -qi '^Cross-Origin-Opener-Policy: same-origin' /tmp/security-headers.txt
          grep -qi '^X-Permitted-Cross-Domain-Policies: none' /tmp/security-headers.txt
          grep -qi '^Strict-Transport-Security: max-age=31536000; includeSubDomains' /tmp/security-headers.txt
          grep -qi '^Content-Security-Policy-Report-Only:' /tmp/security-headers.txt

          cookie="$(grep -i '^Set-Cookie: ROSTERSESSID=' /tmp/security-headers.txt | head -n1)"
          printf '%s\n' "$cookie" | grep -qi 'Secure'
          printf '%s\n' "$cookie" | grep -qi 'HttpOnly'
          printf '%s\n' "$cookie" | grep -qi 'SameSite=Lax'

      - name: Verify CSP contains critical restrictions
        shell: bash
        run: |
          set -euo pipefail
          csp="$(grep -i '^Content-Security-Policy-Report-Only:' /tmp/security-headers.txt | head -n1)"
          printf '%s\n' "$csp" | grep -q "object-src 'none'"
          printf '%s\n' "$csp" | grep -q "base-uri 'self'"
          printf '%s\n' "$csp" | grep -q "form-action 'self'"
          printf '%s\n' "$csp" | grep -q "frame-ancestors 'self'"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: roster-pro-cyclonedx-sbom
          path: build/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop PHP application server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/roster-security-server.pid ]; then
            kill "$(cat /tmp/roster-security-server.pid)" || true
          fi
          cat /tmp/roster-security-server.log || true
